# The eval gate (item 14): every PR and every push to main rebuilds the search
# stack from scratch and re-measures the serving method. A change that makes
# search worse goes red before it can merge.
name: eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Leakage check
        run: bash eval/check_leakage.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install (CPU torch)
        run: pip install -r requirements-api.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: WANDS dataset (public)
        run: git clone --depth 1 https://github.com/wayfair/WANDS.git data/WANDS

      - name: Stored vectors from the data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-v1 --dir data/vectors

      - name: Build the index and point the alias at it
        run: PYTHONPATH=src python src/rebuild_index.py --model minilm

      - name: Eval gate
        run: python eval/ci_gate.py
