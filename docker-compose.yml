# Local services for the WANDS search rebuild.
# One Elasticsearch node and one Redis for the search cache.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: wands-es
    environment:
      # One node, no cluster discovery. Fine for a laptop, never for production.
      - discovery.type=single-node
      # No passwords or HTTPS. Local use only.
      - xpack.security.enabled=false
      # Java heap: half of the container's memory. The other half is for the OS file cache,
      # which Elasticsearch relies on to read index files fast.
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    mem_limit: 2g
    ports:
      - "9200:9200"
    volumes:
      # Named volume so the index survives `docker compose down` and restarts.
      - esdata:/usr/share/elasticsearch/data

  redis:
    image: redis:7.4-alpine
    container_name: wands-redis
    # Small and bounded: the cache holds JSON search responses, nothing precious.
    # When full, Redis evicts the least recently used keys.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m
    ports:
      - "6379:6379"

volumes:
  esdata:
