# kind cluster for item 15. One node; NodePort 30080 is mapped to
# localhost:8080 so Locust on the laptop can reach the API Service.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
