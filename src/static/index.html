<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WANDS Search</title>
<style>
  :root { --bg:#fff; --fg:#1c1c1c; --muted:#6a6a6a; --line:#e3e3e3;
          --exact:#1a7f37; --partial:#9a6700; --irrelevant:#b42318; --none:#6a6a6a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  input[type=text] { flex:2 1 260px; padding:9px 12px; font-size:15px;
    border:1px solid var(--line); border-radius:8px; }
  input#cls { flex:1 1 160px; }
  button { padding:9px 16px; font-size:15px; border:0; border-radius:8px;
    background:#1c1c1c; color:#fff; cursor:pointer; }
  .meta { color:var(--muted); font-size:13px; min-height:18px; margin-bottom:10px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .tab { background:none; color:var(--muted); border:0; border-radius:0;
         border-bottom:2px solid transparent; padding:9px 12px; font-size:14px;
         cursor:pointer; }
  .tab[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--fg);
                               font-weight:600; }
  mark { background:#ffe88f; color:inherit; padding:0 1px; border-radius:2px; }
  .empty { color:var(--muted); font-size:14px; padding:20px 2px; }
  ol { margin:0; padding:0; list-style:none; counter-reset:r; }
  li { border-top:1px solid var(--line); padding:8px 2px; display:flex; gap:10px; }
  li::before { counter-increment:r; content:counter(r); color:var(--muted);
               min-width:1.4em; font-variant-numeric:tabular-nums; }
  .name { flex:1; }
  .cls { color:var(--muted); font-size:12.5px; }
  .badge { font-size:11.5px; border-radius:20px; padding:2px 9px; height:fit-content;
           white-space:nowrap; border:1px solid currentColor; }
  .Exact { color:var(--exact); } .Partial { color:var(--partial); }
  .Irrelevant { color:var(--irrelevant); } .unlabelled { color:var(--none); }
</style>
</head>
<body>
<div class="wrap">
  <h1>WANDS semantic search</h1>
  <div class="sub">The measured best hybrid (BM25 + MiniLM vectors fused with
    RRF), with plain keyword search on the second tab to compare. Type one of
    the 480 WANDS queries to see relevance labels.</div>
  <form id="f">
    <input type="text" id="q" placeholder="e.g. smart coffee table" autofocus>
    <input type="text" id="cls" placeholder="class filter (optional, exact)">
    <button>Search</button>
  </form>
  <div class="meta" id="meta"></div>
  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tab-hybrid"
            aria-selected="true" aria-controls="panel-hybrid">Best match (hybrid)</button>
    <button type="button" class="tab" role="tab" id="tab-bm25"
            aria-selected="false" aria-controls="panel-bm25">Keyword (BM25)</button>
  </div>
  <div id="panel-hybrid" role="tabpanel" aria-labelledby="tab-hybrid">
    <ol id="hybrid"></ol><div class="empty" id="empty-hybrid" hidden></div>
  </div>
  <div id="panel-bm25" role="tabpanel" aria-labelledby="tab-bm25" hidden>
    <ol id="bm25"></ol><div class="empty" id="empty-bm25" hidden></div>
  </div>
</div>
<script>
const f = document.getElementById("f"), meta = document.getElementById("meta");

function showTab(which) {
  for (const w of ["hybrid", "bm25"]) {
    document.getElementById("tab-" + w)
      .setAttribute("aria-selected", w === which ? "true" : "false");
    document.getElementById("panel-" + w).hidden = w !== which;
  }
}
document.getElementById("tab-hybrid").addEventListener("click", () => showTab("hybrid"));
document.getElementById("tab-bm25").addEventListener("click", () => showTab("bm25"));

// Wrap query words found in the text in <mark>, so the shopper sees why a
// result matched. Prefix match, so "chair" also lights up "chairs".
function highlighted(text, tokens) {
  const out = document.createElement("span");
  if (!tokens.length || !text) { out.textContent = text || ""; return out; }
  const re = new RegExp("\\b(" +
    tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") +
    ")", "gi");
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    out.appendChild(document.createTextNode(text.slice(last, m.index)));
    const mk = document.createElement("mark"); mk.textContent = m[0];
    out.appendChild(mk);
    last = m.index + m[0].length;
  }
  out.appendChild(document.createTextNode(text.slice(last)));
  return out;
}

function row(h, labelsKnown, tokens) {
  const li = document.createElement("li");
  const name = document.createElement("div"); name.className = "name";
  name.appendChild(highlighted(h.product_name, tokens));
  const cls = document.createElement("div"); cls.className = "cls";
  cls.appendChild(highlighted(h.product_class || "", tokens));
  name.appendChild(cls);
  li.appendChild(name);
  if (labelsKnown) {
    const b = document.createElement("span");
    const label = h.label || "unlabelled";
    b.className = "badge " + label; b.textContent = label;
    li.appendChild(b);
  }
  return li;
}
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  meta.textContent = "Searching…";
  const cls = document.getElementById("cls").value.trim();
  const url = "/search?q=" + encodeURIComponent(q) +
              (cls ? "&product_class=" + encodeURIComponent(cls) : "");
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    meta.textContent = d.took_ms + " ms" +
      (d.labels_known ? " · WANDS query, labels shown" : " · not a WANDS query, no labels");
    const tokens = q.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 1);
    for (const side of ["bm25", "hybrid"]) {
      const ol = document.getElementById(side);
      ol.replaceChildren(...d[side].map(h => row(h, d.labels_known, tokens)));
      const none = d[side].length === 0;
      const empty = document.getElementById("empty-" + side);
      empty.hidden = !none;
      if (none) {
        empty.textContent = "No results for “" + q + "”." + (cls
          ? " The class filter needs the exact class name: try clearing it."
          : " Try fewer or simpler words.");
      }
    }
    showTab("hybrid");
  } catch (err) { meta.textContent = "Search failed: " + err.message; }
});
</script>
</body>
</html>
